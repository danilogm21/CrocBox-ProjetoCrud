      <a href="perfil.html">PERFIL</a>
      <button id="btn-tema" class="btn-tema" aria-label="Alternar Tema">
          <svg class="icone-sol" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  </header>
  <section class="login">
    <div class="titulo">
      <h1>
        Crie sua <br> <span>Conta</span> 
      </h1>
      <p>
        Peça mais rápido e acompanhe seus pedidos. <br> 
      </p>
    </div>
    <div class="entrar-box">
      <h1>
        Criar Conta
      </h1>
      <p>
        Leva menos de 1 minuto!
      </p>
      <form action="" class="form">
        <label for="">Nome Completo</label> <br>
        <input type="text" placeholder="Seu Nome"> <br>
        <div class="linha-inputs">
          <div>
            <label for="">E-mail</label> <br>
            <input type="email" name="" class="email-criar" placeholder="seuemail@.com">
          </div>
          <div>
            <label for="">Telefone</label> <br>
            <input type="tel" name="" id="telefone" class="email-criar" placeholder="+55 (31) 99999-9999" oninput="mascara_telefone()" maxlength="20">
          </div>
        </div>
        <div class="linha-inputs">
          <div>
            <label for="">Senha</label> <br>
            <input type="password" name="" class="email-criar" placeholder="* * * * * *">
          </div>
          <div>
            <label for="">Repita a senha</label> <br>
            <input type="password" name="" class="email-criar" placeholder="* * * * * *">
          </div>
        </div>
        <button type="submit" class="btn-entrar">Criar Conta</button>
        <div class="linha"><hr> OU <hr></div>
        <p>Já tem uma conta? <a href="login.html">Entre</a></p>
      </form>
    </div>
  </section>

  <footer class="rodape">
    <img src="logo-semfundo.png" alt="">
    <p>Frango frito extra crocante!</p>
  </footer>

  <script src="script.js"></script>
