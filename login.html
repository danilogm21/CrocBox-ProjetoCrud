            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

        </button>
    </nav>
  </header>
  <section class="login">
    <div class="titulo">
      <h1>
        Abra a <br> <span>caixa</span> e <br> peça
      </h1>
      <p>
        Entre na sua conta e receba frango frito <br> extra crocante na sua porta.
      </p>
    </div>
    <div class="entrar-box">
      <h1>
        Entrar
      </h1>
      <p>
        Use seu e-mail e senha para fazer o pedido.
      </p>
      <form action="">
        <label for="">E-mail</label> <br>
        <input type="email" name="" id="" placeholder="seuemail@.com"> <br>
        <label for="">Senha</label> <br>
        <input type="password" name="" id="" placeholder="* * * * * *"> <br>
        <button type="submit" class="btn-entrar">Entrar</button>
        <div class="linha"><hr> OU <hr></div>
        <button type="button" class="btn-criar" onclick="window.location.href='criarconta.html'">Criar conta</button>      </form>
    </div>
  </section>

  <footer class="rodape">
    <img src="logo-semfundo.png" alt="">
    <p>Frango frito extra crocante!</p>
  </footer>

  <script src="script.js"></script>
